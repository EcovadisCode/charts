name: Release a chart

on:
  push:
    branches:
      - master


jobs:
  release-core:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: master

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Helm tool installer
        uses: azure/setup-helm@v1
        with:
          version: '3.5.4'
        id: install

      - name: Add dependency chart repos
        run: |
          helm repo add ecovadis https://ecovadiscode.github.io/charts/

      - name: Remove all charts except core
        run: |
          find charts/ -mindepth 1 -maxdepth 1 -type d ! -name core -exec rm -rf {} +

      - name: Run chart-releaser for core
        uses: helm/chart-releaser-action@v1.4.0
        with:
          charts_dir: "charts"
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  release-remaining:
    needs: release-core
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: master

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Helm tool installer
        uses: azure/setup-helm@v1
        with:
          version: '3.5.4'
        id: install

      - name: Add dependency chart repos
        run: |
          helm repo add ecovadis https://ecovadiscode.github.io/charts/

      - name: Exclude already-released core chart from this job
        run: |
          # release-core already tagged+released charts-core on this same commit.
          # chart-releaser resolves its "latest tag" baseline via `git describe`
          # and re-runs `git fetch --tags` itself before that, so merely deleting
          # the local charts-core-* tag isn't enough - it gets re-fetched from
          # origin. A negative refspec stops it from being fetched back, so
          # `git describe` falls through to the true previous tag and this job
          # still sees the actual chart changes instead of diffing HEAD against
          # itself.
          git config --add remote.origin.fetch '^refs/tags/charts-core-*'
          git tag -l 'charts-core-*' | xargs -r git tag -d
          # core is already released by release-core; exclude it here so it
          # isn't re-packaged/re-released (which would fail with tag_name
          # already_exists).
          rm -rf charts/core

      - name: Wait for core chart availability in Helm repo
        run: |
          # Find the highest core version required by any dependent chart
          NEEDED_VERSION=$(grep -A1 'name: charts-core' charts/*/Chart.yaml | grep 'version:' | sed 's/.*version:[[:space:]]*//' | tr -d '"' | sort -V | tail -1)
          if [ -z "$NEEDED_VERSION" ]; then
            echo "No charts depend on charts-core, skipping wait."
            exit 0
          fi
          echo "Highest charts-core version needed by dependent charts: ${NEEDED_VERSION}"
          for i in $(seq 1 30); do
            helm repo update 2>/dev/null
            if helm search repo ecovadis/charts-core --version "${NEEDED_VERSION}" | grep -q "${NEEDED_VERSION}"; then
              echo "charts-core ${NEEDED_VERSION} is available!"
              exit 0
            fi
            echo "Attempt ${i}/30 - not yet available, waiting 10s..."
            sleep 10
          done
          echo "Timeout waiting for charts-core ${NEEDED_VERSION} after 5 minutes"
          exit 1

      - name: Run chart-releaser for remaining charts
        uses: helm/chart-releaser-action@v1.4.0
        with:
          charts_dir: "charts"
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
