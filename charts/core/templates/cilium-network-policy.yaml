{{- if and .Values.global.defaultNetworkPolicyEnabled (eq (include "charts-core.useCilium" .) "true") -}}
{{/*
  CiliumNetworkPolicy equivalent of network-policy.yaml, for clusters running
  Azure CNI powered by Cilium.

  Only one of the two templates renders per release - see the
  "charts-core.useCilium" helper in _helpers.tpl.

  This is NOT a line-for-line translation. Cilium enforces policy through a
  per-endpoint BPF map (cilium_policy_v2_<id>, default 16384 entries) keyed on
  (identity, port, protocol, direction), so a selector matching every pod in the
  cluster costs one entry per identity PER PORT. The `namespaceSelector: {}`
  peers in network-policy.yaml cost ~18 entries per cluster identity, which
  overflows the map on a large cluster and blocks pod creation on the node.

*/}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "charts-core.fullname" . }}
  labels:
    {{- include "charts-core.labels" . | nindent 4 }}
    networkPolicyType: default
spec:
  endpointSelector:
    matchLabels:
      {{- include "charts-core.selectorLabels" . | nindent 6 }}

  ingress:
    # --- same namespace, all ports (NP ingress rule 1) ---
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}

  {{- if .Values.global.allowAllInternalClusterTrafficNetworkPolicy }}
    # --- any pod in the cluster, all ports (NP ingress rule 2, allowAll variant) ---
    #
    # `- {}` would mean "all endpoints in THIS namespace" - a namespaced CNP
    # implicitly scopes an empty selector to its own namespace. Matching every
    # namespace requires the Exists operator on the namespace label.
    - fromEndpoints:
        - matchExpressions:
            - key: "k8s:io.kubernetes.pod.namespace"
              operator: "Exists"
  {{- else }}
    # --- same environment (*-infra, *-backend, *-frontend), all ports (NP ingress rule 2) ---
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.environment: {{ (split "-" .Release.Namespace)._0 }}
  {{- end }}

  {{- if .Values.global.monitoring.servicemonitor.enabled }}
    # --- prometheus scrape, all ports (NP ingress rule 3) ---
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.environment: {{ .Values.global.monitoring.prometheusNamespace }}
  {{- end }}

    # --- outside world + node-sourced traffic (NP ingress rule 4) ---
    #
    # world       : genuine external clients (sentry, optimizely, probes)
    # host /
    # remote-node : LoadBalancer and NodePort Services on the default
    #               externalTrafficPolicy: Cluster SNAT the client to a node IP.
    #               Node addresses resolve to host/remote-node, which no CIDR
    #               selector can ever match. NPM did not enforce ingress policy
    #               on this path at all; Cilium does, so it must be stated.
    #
    # The namespaceSelector/podSelector peers on the NPM rule are NOT translated
    # here - in-cluster clients are already covered by the same-namespace and
    # same-environment rules above. Those peers are what cost 6 entries per
    # cluster identity on ingress.
    - fromEntities:
        - world
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
            - port: "8443"
              protocol: TCP
            - port: "8000"
              protocol: TCP
  {{- if .Values.global.monitoring.metrics.enabled }}
            - port: "{{ .Values.global.monitoring.metrics.port }}"  #metrics port
              protocol: TCP
  {{- end }}
  {{- if .Values.global.servicebusNetworkPolicyEnabled }}
            - port: "5671"  #servicebus
              protocol: TCP
  {{- end }}

  egress:
    # --- same namespace, all ports (NP egress rule 1) ---
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}

    # --- kube-dns (NP egress rule 2) ---
    #
    # The namespace MUST be stated. A selector in a namespaced CNP is implicitly
    # scoped to the policy's own namespace, so `k8s-app: kube-dns` alone means
    # "kube-dns pods in THIS namespace" - which is none, and all DNS is denied.
    # The Kubernetes NetworkPolicy expresses the same thing as a combined
    # namespaceSelector: {} + podSelector peer.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

  {{- if .Values.global.allowAllInternalClusterTrafficNetworkPolicy }}
    # --- any pod in the cluster (NP egress rule 3, allowAll variant) ---
    #
    # See the ingress allowAll note: `- {}` is own-namespace only.
    - toEndpoints:
        - matchExpressions:
            - key: "k8s:io.kubernetes.pod.namespace"
              operator: "Exists"
  {{- else }}
    # --- same environment (NP egress rule 3) ---
    #
    # Port list dropped: ingress rule 2 already allows the same peers on every
    # port, so this only makes egress symmetric with ingress. Costs 1 map entry
    # per identity instead of 4.
    - toEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.environment: {{ (split "-" .Release.Namespace)._0 }}
  {{- end }}

    # --- node egress (no NP equivalent - Kubernetes NetworkPolicy cannot select a node) ---
    #
    # Node addresses resolve to host/remote-node and are never matched by an
    # ipBlock. NPM additionally allowed pod -> own-node egress implicitly.
    # Neither carries over to Cilium. kube-apiserver is its own reserved
    # identity on managed AKS. Port-less: a few reserved identities, 1 entry each.
    - toEntities:
        - host
        - remote-node
        - kube-apiserver

    # --- outside world - sentry, optimizely, PaaS endpoints (NP egress rule 4) ---
    #
    # The namespaceSelector/podSelector peers on the NPM rule are NOT translated.
    # Every destination below is external or PaaS and resolves to `world`;
    # in-cluster traffic is carried by the same-namespace and same-environment
    # rules above. Those peers are what cost ~12 entries per cluster identity.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
            - port: "8433"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8200"
              protocol: TCP
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
  {{- if .Values.global.elasticNetworkPolicyEnabled }}
            - port: "9243"  #elasticcloud
              protocol: TCP
  {{- end }}
  {{- if .Values.global.postgresNetworkPolicyEnabled }}
            - port: "5432"  #postgres
              protocol: TCP
  {{- end }}
  {{- if .Values.global.zyteProxyNetworkPolicyEnabled }}
            - port: "8010"   #Zyte Proxy
              protocol: TCP
            - port: "8011"
              protocol: TCP
            - port: "8014"
              protocol: TCP
  {{- end }}
  {{- if .Values.global.mongodbNetworkPolicyEnabled }}
            # Use mongodbStrictNetworkPolicy if possible to avoid opening unnecessary ports
            - port: "1024"
              endPort: 65535
              protocol: TCP
  {{- end }}
  {{- if .Values.global.mongodbStrictNetworkPolicyEnabled }}
            - port: "27017"  # Only open port 27017 when Strict Network Policy is enabled
              protocol: TCP
  {{- end }}
  {{- if .Values.global.eventHubNetworkPolicyEnabled }}
            - port: "5671" # - AMQP Ports
              protocol: TCP
            - port: "5672"
              protocol: TCP
            - port: "9093" # - Kafka Port
              protocol: TCP
  {{- end }}
  {{- if .Values.global.servicebusNetworkPolicyEnabled }}
            - port: "5671"  #servicebus
              protocol: TCP
  {{- end }}
  {{- if .Values.global.redisNetworkPolicyEnabled }}
            - port: "6380"
              protocol: TCP
  {{- end }}
  {{- if .Values.global.sqlNetworkPolicyEnabled }}
            - port: "1433"  #mssql
              protocol: TCP
            - port: "11000"  # Redirect connection policy (default)
              endPort: 11999
              protocol: TCP
  {{- end }}
  {{- if .Values.global.lnmElasticNetworkPolicyEnabled }}
            - port: "9201"
              protocol: TCP
  {{- end }}
  {{- if .Values.global.cosmosNetworkPolicyEnabled }}
            - port: "10255"
              protocol: TCP
  {{- end }}
{{- end -}}
